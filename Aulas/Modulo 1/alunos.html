<body>
    <h1>Alunos</h1>
    <script>function primeiraEtapa (acertoProva , semCursado) {
       const NumQuestoes = 20
       const notaMinAprov = 0.7
       const qtdeSemestres = 3 

       let nota = acertoProva / NumQuestoes
       console.log(nota)
       if ((nota >= notaMinAprov) && (semCursado >= qtdeSemestres)) {
            return "Aprovado";
       }
       else if (nota >= notaMinAprov) {
            return "Você concluiu o banco de currículos"
       }else{
            return "Reprovado"
       }

    }
    
    console.log(primeiraEtapa(16, 3));
    console.log(primeiraEtapa(10, 2));
    </script>
